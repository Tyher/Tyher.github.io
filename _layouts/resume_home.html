---
layout: default
---

{% include base_path %}

<main id="main" class="resume-main" role="main">
  <article class="resume-page" itemscope itemtype="http://schema.org/Person">
    {% if page.title %}<meta itemprop="name" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
    {% if page.excerpt %}<meta itemprop="description" content="{{ page.excerpt | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}

    <section class="page__content resume-content" itemprop="description">
      {{ content }}
    </section>
  </article>
</main>
